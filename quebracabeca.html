<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Quebra-cabeça &mdash; Yudi & Karol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --preto:#16110f; --preto-2:#201917; --preto-3:#2a2119;
    --branco:#faf5f0; --rosa:#e6a4b4; --rosa-forte:#c9748c; --dourado:#cba46a;
    --linha:rgba(250,245,240,0.14);
    --cols:5; --rows:10; --ratio:1.5;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--preto); color:var(--branco); font-family:'Jost',sans-serif; font-weight:300;
    min-height:100vh; padding:5vh 5vw 8vh;
  }
  h1,.serif{font-family:'Cormorant Garamond',serif; font-weight:500;}
  a{color:inherit;}
  .top{max-width:820px; margin:0 auto 2rem; text-align:center;}
  .kicker{font-size:0.7rem; letter-spacing:0.35em; text-transform:uppercase; color:var(--dourado); margin-bottom:0.7rem;}
  h1{font-size:clamp(1.8rem,5vw,2.6rem); font-style:italic; margin-bottom:0.8rem;}
  .top p{color:rgba(250,245,240,0.6); font-size:0.9rem; max-width:52ch; margin:0 auto;}
  .back-link{display:inline-block; margin-top:1.4rem; font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase; color:rgba(250,245,240,0.5); border-bottom:1px solid var(--linha); padding-bottom:2px;}
  .back-link:hover{color:var(--rosa);}

  .hud{
    max-width:820px; margin:0 auto 1.6rem; display:flex; justify-content:center; align-items:center; gap:1.2rem;
    flex-wrap:wrap; font-size:0.78rem; letter-spacing:0.06em; color:rgba(250,245,240,0.65);
  }
  .hud b{color:var(--rosa); font-family:'Cormorant Garamond',serif; font-size:1.05rem; letter-spacing:0;}
  .hud-btn{
    background:none; border:1px solid var(--linha); color:var(--branco); padding:0.5rem 1.1rem; border-radius:999px;
    font-family:'Jost',sans-serif; font-size:0.72rem; letter-spacing:0.08em; text-transform:uppercase; cursor:pointer;
    transition:border-color 0.2s ease, background 0.2s ease;
  }
  .hud-btn:hover{border-color:var(--rosa-forte); background:var(--preto-2);}

  .stage{max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:1.6rem;}

  #board{
    display:grid; grid-template-columns:repeat(var(--cols), 1fr);
    gap:2px; background:var(--preto-2); border:1px solid var(--linha); border-radius:8px; padding:2px;
    max-width:460px; margin:0 auto; width:100%;
    box-shadow:0 20px 50px -18px rgba(0,0,0,0.7);
  }
  .board-cell{
    position:relative; aspect-ratio:var(--ratio); background:var(--preto-3);
    outline:1px dashed rgba(250,245,240,0.08); outline-offset:-1px;
  }
  .board-cell.hover-target{outline:2px solid var(--rosa); outline-offset:-2px;}

  .piece{
    width:100%; height:100%; aspect-ratio:var(--ratio); background-repeat:no-repeat;
    cursor:grab; touch-action:none; border-radius:2px; box-shadow:0 2px 6px rgba(0,0,0,0.4);
    transition:box-shadow 0.15s ease;
  }
  .piece.dragging{cursor:grabbing; position:fixed; z-index:500; box-shadow:0 20px 40px -12px rgba(0,0,0,0.8); pointer-events:none;}
  .piece.locked{cursor:default; box-shadow:none; outline:1px solid rgba(203,164,106,0.5); outline-offset:-1px;}

  #tray{
    background:var(--preto-2); border:1px solid var(--linha); border-radius:10px; padding:1rem;
    display:flex; flex-wrap:wrap; gap:6px; justify-content:center; min-height:110px; align-content:flex-start;
  }
  #tray .piece{width:56px;}
  @media (max-width:480px){ #tray .piece{width:44px;} }

  .ref-toggle{
    position:fixed; right:1.2rem; bottom:1.2rem; z-index:50; display:flex; flex-direction:column; align-items:flex-end; gap:0.6rem;
  }
  .ref-btn{
    width:46px; height:46px; border-radius:50%; background:var(--rosa-forte); border:none; color:var(--preto);
    font-size:1.1rem; box-shadow:0 10px 24px -8px rgba(0,0,0,0.6);
  }
  .ref-preview{
    display:none; width:130px; border-radius:8px; overflow:hidden; border:2px solid var(--rosa-forte);
    box-shadow:0 14px 34px -10px rgba(0,0,0,0.7);
  }
  .ref-preview.show{display:block;}
  .ref-preview img{display:block; width:100%;}

  #win-overlay{
    position:fixed; inset:0; z-index:600; background:rgba(10,7,6,0.92); backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center; flex-direction:column; gap:1.2rem; text-align:center; padding:6vh 6vw;
  }
  #win-overlay.show{display:flex;}
  #win-overlay img{max-width:min(70vw,320px); border-radius:10px; box-shadow:0 30px 70px -20px rgba(0,0,0,0.8);}
  #win-overlay h2{font-size:clamp(1.8rem,6vw,2.6rem); font-style:italic;}
  #win-overlay p{color:rgba(250,245,240,0.7); font-size:0.9rem;}
  .btn{
    background:var(--rosa-forte); border:none; color:var(--preto); padding:0.85rem 2rem; border-radius:999px;
    font-size:0.78rem; letter-spacing:0.14em; text-transform:uppercase; cursor:pointer;
  }
  #confetti-layer{position:fixed; inset:0; pointer-events:none; z-index:601; overflow:hidden;}
  .confetti-piece{position:absolute; top:-5%; font-size:1.1rem; animation:confettiFall linear forwards;}
  @keyframes confettiFall{ to{ transform:translateY(110vh) rotate(600deg); opacity:0.2; } }
</style>
</head>
<body>

<div class="top">
  <div class="kicker">só nós dois</div>
  <h1>quebra-cabeça</h1>
  <p>50 peças da nossa foto. Arraste cada uma pro lugar certo no tabuleiro. Se travar, dá uma espiadinha na referência lá no canto.</p>
</div>

<div class="hud">
  <span>peças certas: <b id="hud-correct">0</b>/50</span>
  <span>tempo: <b id="hud-time">00:00</b></span>
  <button class="hud-btn" id="btn-shuffle">embaralhar</button>
  <button class="hud-btn" id="btn-restart">reiniciar</button>
  <a class="back-link" href="index.html">&larr; voltar pro site</a>
</div>

<div class="stage">
  <div id="board"></div>
  <div id="tray"></div>
</div>

<div class="ref-toggle">
  <div class="ref-preview" id="ref-preview"><img src="assets/puzzle-foto.jpg" alt="referência"></div>
  <button class="ref-btn" id="btn-ref" aria-label="ver imagem de referência">👁️</button>
</div>

<div id="confetti-layer"></div>
<div id="win-overlay">
  <img src="assets/puzzle-foto.jpg" alt="Yudi e Karol">
  <h2>vocês montaram!</h2>
  <p id="win-time"></p>
  <button class="btn" id="btn-play-again">jogar de novo</button>
</div>

<script>
const COLS = 5, ROWS = 10, TOTAL = COLS * ROWS;
const board = document.getElementById('board');
const tray = document.getElementById('tray');
const hudCorrect = document.getElementById('hud-correct');
const hudTime = document.getElementById('hud-time');

let boardSlots = new Array(TOTAL).fill(null); // pieceId or null
let lockedCount = 0;
let seconds = 0;
let timerInt = null;
let running = false;

function buildBoard(){
  board.innerHTML = '';
  for(let i=0;i<TOTAL;i++){
    const cell = document.createElement('div');
    cell.className = 'board-cell';
    cell.dataset.idx = i;
    board.appendChild(cell);
  }
}

function shuffledOrder(){
  const arr = [...Array(TOTAL).keys()];
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function makePiece(correctIdx){
  const piece = document.createElement('div');
  piece.className = 'piece';
  piece.dataset.correct = correctIdx;
  const col = correctIdx % COLS;
  const row = Math.floor(correctIdx / COLS);
  piece.style.backgroundImage = "url('assets/puzzle-foto.jpg')";
  piece.style.backgroundSize = (COLS*100) + '% ' + (ROWS*100) + '%';
  piece.style.backgroundPosition = (col/(COLS-1)*100) + '% ' + (row/(ROWS-1)*100) + '%';
  attachDrag(piece);
  return piece;
}

function initGame(){
  buildBoard();
  tray.innerHTML = '';
  boardSlots = new Array(TOTAL).fill(null);
  lockedCount = 0;
  seconds = 0;
  running = false;
  hudCorrect.textContent = '0';
  hudTime.textContent = '00:00';
  clearInterval(timerInt);

  const order = shuffledOrder();
  order.forEach(idx => {
    const piece = makePiece(idx);
    tray.appendChild(piece);
  });
}

function startTimerIfNeeded(){
  if(running) return;
  running = true;
  timerInt = setInterval(() => {
    seconds++;
    const m = String(Math.floor(seconds/60)).padStart(2,'0');
    const s = String(seconds%60).padStart(2,'0');
    hudTime.textContent = m+':'+s;
  }, 1000);
}

/* ---------- drag logic (pointer events, mouse + touch) ---------- */
let dragState = null;

function attachDrag(piece){
  piece.addEventListener('pointerdown', (e) => {
    if(piece.classList.contains('locked')) return;
    e.preventDefault();
    const rect = piece.getBoundingClientRect();
    dragState = {
      piece,
      offsetX: e.clientX - rect.left,
      offsetY: e.clientY - rect.top,
      originParent: piece.parentElement,
      originNext: piece.nextSibling,
      width: rect.width,
      height: rect.height
    };
    piece.setPointerCapture(e.pointerId);
    piece.classList.add('dragging');
    piece.style.width = rect.width + 'px';
    piece.style.height = rect.height + 'px';
    document.body.appendChild(piece);
    positionDragged(e.clientX, e.clientY);
    startTimerIfNeeded();
  });

  piece.addEventListener('pointermove', (e) => {
    if(!dragState || dragState.piece !== piece) return;
    positionDragged(e.clientX, e.clientY);
    highlightTarget(e.clientX, e.clientY);
  });

  piece.addEventListener('pointerup', (e) => {
    if(!dragState || dragState.piece !== piece) return;
    dropPiece(e.clientX, e.clientY);
  });
}

function positionDragged(x, y){
  const { piece, offsetX, offsetY } = dragState;
  piece.style.left = (x - offsetX) + 'px';
  piece.style.top = (y - offsetY) + 'px';
}

function clearHighlights(){
  document.querySelectorAll('.board-cell.hover-target').forEach(c => c.classList.remove('hover-target'));
}

function elementUnder(x, y){
  dragState.piece.style.pointerEvents = 'none';
  const el = document.elementFromPoint(x, y);
  dragState.piece.style.pointerEvents = '';
  return el;
}

function highlightTarget(x, y){
  clearHighlights();
  const el = elementUnder(x, y);
  const cell = el ? el.closest('.board-cell') : null;
  if(cell) cell.classList.add('hover-target');
}

function dropPiece(x, y){
  const { piece, originParent, originNext, width, height } = dragState;
  clearHighlights();
  piece.classList.remove('dragging');
  piece.style.position = '';
  piece.style.left = '';
  piece.style.top = '';
  piece.style.width = '';
  piece.style.height = '';

  const el = elementUnder(x, y);
  const cell = el ? el.closest('.board-cell') : null;
  const trayHit = el ? el.closest('#tray') : null;

  dragState = null;

  if(cell){
    const idx = parseInt(cell.dataset.idx, 10);
    const occupantId = boardSlots[idx];
    if(occupantId === null){
      placeInCell(piece, cell, idx);
      return;
    } else if(!occupantId.classList.contains('locked')){
      // swap: move occupant to tray, place dragged piece here
      const occupant = occupantId;
      const fromIdx = parseInt(piece.dataset.homeIdx ?? -1, 10);
      if(!isNaN(fromIdx) && fromIdx >= 0) boardSlots[fromIdx] = null;
      tray.appendChild(occupant);
      occupant.dataset.homeIdx = '';
      placeInCell(piece, cell, idx);
      return;
    }
    // occupied by locked piece -> reject, return to origin
  } else if(trayHit){
    returnToOrigin(piece, tray, null);
    return;
  }
  // invalid drop -> return to original spot
  returnToOrigin(piece, originParent, originNext);
}

function returnToOrigin(piece, parent, next){
  const fromIdx = parseInt(piece.dataset.homeIdx ?? -1, 10);
  if(!isNaN(fromIdx) && fromIdx >= 0 && boardSlots[fromIdx] === piece){
    boardSlots[fromIdx] = null;
  }
  piece.dataset.homeIdx = '';
  if(next && next.parentElement === parent){
    parent.insertBefore(piece, next);
  } else {
    parent.appendChild(piece);
  }
}

function placeInCell(piece, cell, idx){
  const prevIdx = parseInt(piece.dataset.homeIdx ?? -1, 10);
  if(!isNaN(prevIdx) && prevIdx >= 0) boardSlots[prevIdx] = null;

  cell.appendChild(piece);
  boardSlots[idx] = piece;
  piece.dataset.homeIdx = idx;

  const correct = parseInt(piece.dataset.correct, 10);
  if(correct === idx){
    piece.classList.add('locked');
    lockedCount++;
    hudCorrect.textContent = lockedCount;
    if(lockedCount === TOTAL) onWin();
  }
}

function onWin(){
  clearInterval(timerInt);
  const m = String(Math.floor(seconds/60)).padStart(2,'0');
  const s = String(seconds%60).padStart(2,'0');
  const finalTime = m+':'+s;

  const best = localStorage.getItem('puzzleBestTime');
  let msg = `Vocês terminaram em ${finalTime}.`;
  if(!best || seconds < parseInt(best, 10)){
    localStorage.setItem('puzzleBestTime', seconds);
    msg += ' Novo recorde de vocês! 🏆';
  } else {
    const bm = String(Math.floor(best/60)).padStart(2,'0');
    const bs = String(best%60).padStart(2,'0');
    msg += ` Recorde atual: ${bm}:${bs}.`;
  }
  document.getElementById('win-time').textContent = msg;
  document.getElementById('win-overlay').classList.add('show');
  launchConfetti();
}

function launchConfetti(){
  const layer = document.getElementById('confetti-layer');
  const syms = ['♥','❀','✨','★'];
  for(let i=0;i<40;i++){
    const el = document.createElement('span');
    el.className = 'confetti-piece';
    el.textContent = syms[Math.floor(Math.random()*syms.length)];
    el.style.left = Math.random()*100+'vw';
    el.style.color = Math.random() > 0.5 ? '#e6a4b4' : '#cba46a';
    el.style.animationDuration = (2.6+Math.random()*2.2)+'s';
    el.style.animationDelay = (Math.random()*1.2)+'s';
    layer.appendChild(el);
    setTimeout(()=>el.remove(), 5500);
  }
}

document.getElementById('btn-shuffle').addEventListener('click', () => {
  const allPieces = [...board.querySelectorAll('.piece'), ...tray.querySelectorAll('.piece')]
    .filter(p => !p.classList.contains('locked'));
  allPieces.forEach(p => {
    const idx = parseInt(p.dataset.homeIdx ?? -1, 10);
    if(!isNaN(idx) && idx >= 0) boardSlots[idx] = null;
    p.dataset.homeIdx = '';
  });
  // shuffle into tray in random order
  const shuffled = allPieces.sort(() => Math.random()-0.5);
  shuffled.forEach(p => tray.appendChild(p));
});

document.getElementById('btn-restart').addEventListener('click', initGame);
document.getElementById('btn-play-again').addEventListener('click', () => {
  document.getElementById('win-overlay').classList.remove('show');
  initGame();
});

document.getElementById('btn-ref').addEventListener('click', () => {
  document.getElementById('ref-preview').classList.toggle('show');
});

initGame();
</script>
</body>
</html>
